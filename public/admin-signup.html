<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SurePickup - Admin Signup">
    <title>Complete Your Registration - SurePickup</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --coral: #E07A5F;
            --coral-dark: #C4563A;
            --teal: #3D5A5B;
            --teal-light: #5B8A8B;
            --cream: #F4F1DE;
            --cream-dark: #E8E4CC;
            --charcoal: #2B2D42;
            --sage: #81B29A;
            --sand: #F2CC8F;
            --bg-main: #FDFCF7;
            --text-dark: #2B2D42;
            --text-muted: #6B6E7B;
            --error: #E53935;
            --success: #43A047;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, var(--bg-main) 0%, var(--cream) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .signup-container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 3rem;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.1),
                0 0 0 1px rgba(255, 255, 255, 0.5) inset;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--teal);
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .logo span {
            color: var(--coral);
        }

        .tagline {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 1rem;
            font-size: 0.95rem;
        }

        .school-badge {
            background: var(--cream);
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            margin-bottom: 2rem;
        }

        .school-badge .label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.25rem;
        }

        .school-badge .school-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--teal);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--charcoal);
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--cream-dark);
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
            background: white;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--teal);
            box-shadow: 0 0 0 4px rgba(61, 90, 91, 0.1);
        }

        .form-group input:disabled {
            background: var(--cream);
            color: var(--text-muted);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--sage);
            color: white;
        }

        .btn-primary:hover {
            background: #6a9a82;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(129, 178, 154, 0.3);
        }

        .btn-primary:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .message {
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            display: none;
        }

        .message.show {
            display: block;
        }

        .message.error {
            background: rgba(229, 57, 53, 0.1);
            border: 1px solid var(--error);
            color: var(--error);
        }

        .message.success {
            background: rgba(67, 160, 71, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .btn.loading .loading-spinner {
            display: inline-block;
        }

        .password-requirements {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        .invalid-invite {
            text-align: center;
            padding: 3rem;
        }

        .invalid-invite h2 {
            color: var(--error);
            margin-bottom: 1rem;
        }

        .invalid-invite p {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .invalid-invite a {
            color: var(--teal);
            text-decoration: none;
        }

        .invalid-invite a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .signup-container {
                padding: 2rem;
            }

            .logo {
                font-size: 1.75rem;
            }
        }
    </style>
</head>

<body>
    <div class="signup-container">
        <!-- Loading State -->
        <div id="loadingState" style="text-align: center; padding: 2rem;">
            <p>Validating invite...</p>
        </div>

        <!-- Invalid Invite State -->
        <div id="invalidState" class="invalid-invite" style="display: none;">
            <h2>❌ Invalid Invite</h2>
            <p id="invalidMessage">This invite link is invalid or has expired.</p>
            <a href="landing.html">← Back to Home</a>
        </div>

        <!-- Signup Form -->
        <div id="signupForm" style="display: none;">
            <div class="logo">Sure<span>Pickup</span></div>
            <p class="tagline">Complete your admin registration</p>

            <div class="school-badge">
                <div class="label">You're joining</div>
                <div class="school-name" id="schoolName">Loading...</div>
            </div>

            <div class="message" id="messageBox"></div>

            <form id="registrationForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" disabled>
                </div>

                <div class="form-group">
                    <label for="displayName">Your Full Name</label>
                    <input type="text" id="displayName" required placeholder="Enter your name">
                </div>

                <div class="form-group">
                    <label for="password">Create Password</label>
                    <input type="password" id="password" required placeholder="Min 6 characters" minlength="6">
                    <p class="password-requirements">At least 6 characters</p>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" required placeholder="Re-enter password">
                </div>

                <button type="submit" class="btn btn-primary" id="submitBtn">
                    <span class="loading-spinner"></span>
                    <span class="btn-text">Create Account</span>
                </button>
            </form>
        </div>

        <!-- Success State -->
        <div id="successState" style="display: none; text-align: center;">
            <div style="font-size: 4rem; margin-bottom: 1rem;">✅</div>
            <h2 style="color: var(--sage); margin-bottom: 1rem;">Account Created!</h2>
            <p style="color: var(--text-muted); margin-bottom: 1.5rem;">
                Your admin account has been set up. You can now log in.
            </p>
            <a href="login.html" class="btn btn-primary" style="display: inline-block; text-decoration: none;">
                Go to Login
            </a>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        // Get invite token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const inviteToken = urlParams.get('token');

        let inviteData = null;

        // Validate invite on page load
        async function validateInvite() {
            if (!inviteToken) {
                showInvalid('No invite token provided.');
                return;
            }

            try {
                // Look up invite in Firestore
                const inviteDoc = await db.collection('adminInvites').doc(inviteToken).get();

                if (!inviteDoc.exists) {
                    showInvalid('This invite link is invalid.');
                    return;
                }

                inviteData = inviteDoc.data();

                // Check if already used
                if (inviteData.status === 'used') {
                    showInvalid('This invite has already been used.');
                    return;
                }

                // Check if expired (24 hours)
                const createdAt = inviteData.createdAt?.toDate() || new Date(0);
                const now = new Date();
                const hoursDiff = (now - createdAt) / (1000 * 60 * 60);
                if (hoursDiff > 24) {
                    showInvalid('This invite has expired. Please request a new one.');
                    return;
                }

                // Valid invite - show form
                showSignupForm();

            } catch (error) {
                console.error('Error validating invite:', error);
                showInvalid('Error validating invite. Please try again.');
            }
        }

        function showInvalid(message) {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('invalidState').style.display = 'block';
            document.getElementById('invalidMessage').textContent = message;
        }

        async function showSignupForm() {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('signupForm').style.display = 'block';

            // Populate form with invite data
            document.getElementById('email').value = inviteData.email;
            document.getElementById('displayName').value = inviteData.displayName || '';

            // Get school name
            try {
                const schoolDoc = await db.collection('schools').doc(inviteData.schoolId).get();
                if (schoolDoc.exists) {
                    document.getElementById('schoolName').textContent = schoolDoc.data().name;
                }
            } catch (e) {
                console.error('Error fetching school:', e);
            }
        }

        // Handle form submission
        document.getElementById('registrationForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const displayName = document.getElementById('displayName').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitBtn = document.getElementById('submitBtn');

            // Validate passwords match
            if (password !== confirmPassword) {
                showMessage('Passwords do not match.', 'error');
                return;
            }

            // Show loading
            submitBtn.classList.add('loading');
            submitBtn.disabled = true;
            hideMessage();

            try {
                // Create Firebase Auth account
                const userCredential = await auth.createUserWithEmailAndPassword(inviteData.email, password);
                const user = userCredential.user;

                // Update display name
                await user.updateProfile({ displayName: displayName });

                // Create user document in Firestore
                await db.collection('users').doc(user.uid).set({
                    email: inviteData.email,
                    displayName: displayName,
                    role: inviteData.role || 'admin',
                    schoolId: inviteData.schoolId,
                    status: 'active',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    inviteToken: inviteToken
                });

                // Mark invite as used
                await db.collection('adminInvites').doc(inviteToken).update({
                    status: 'used',
                    usedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    userId: user.uid
                });

                // Update school with admin info
                await db.collection('schools').doc(inviteData.schoolId).update({
                    adminId: user.uid,
                    adminEmail: inviteData.email
                });

                // Sign out (they'll sign in fresh)
                await auth.signOut();

                // Show success
                document.getElementById('signupForm').style.display = 'none';
                document.getElementById('successState').style.display = 'block';

            } catch (error) {
                console.error('Signup error:', error);
                let message = 'Error creating account. Please try again.';
                if (error.code === 'auth/email-already-in-use') {
                    message = 'An account with this email already exists. Try logging in instead.';
                } else if (error.code === 'auth/weak-password') {
                    message = 'Password is too weak. Please use at least 6 characters.';
                }
                showMessage(message, 'error');
            } finally {
                submitBtn.classList.remove('loading');
                submitBtn.disabled = false;
            }
        });

        function showMessage(text, type) {
            const box = document.getElementById('messageBox');
            box.textContent = text;
            box.className = `message show ${type}`;
        }

        function hideMessage() {
            document.getElementById('messageBox').className = 'message';
        }

        // Start validation
        validateInvite();
    </script>
</body>

</html>
