<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pair Display - SurePickup</title>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1b4b, #312e81, #4c1d95);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            background: white;
            border-radius: 24px;
            padding: 3rem;
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        }

        .logo {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        h1 {
            color: #1e1b4b;
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }

        .code-inputs {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .code-input {
            width: 55px;
            height: 70px;
            font-size: 2rem;
            text-align: center;
            border: 3px solid #e2e8f0;
            border-radius: 12px;
            font-weight: 700;
            color: #1e1b4b;
            transition: all 0.2s;
        }

        .code-input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
        }

        .btn-connect {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            padding: 1rem 3rem;
            font-size: 1.25rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
        }

        .btn-connect:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
        }

        .btn-connect:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 8px;
            display: none;
        }

        .status.error {
            display: block;
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        .status.success {
            display: block;
            background: #f0fdf4;
            color: #16a34a;
            border: 1px solid #bbf7d0;
        }

        .status.loading {
            display: block;
            background: #eff6ff;
            color: #2563eb;
            border: 1px solid #bfdbfe;
        }

        .footer {
            color: rgba(255, 255, 255, 0.7);
            margin-top: 2rem;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">📺</div>
        <h1>Pair Display</h1>
        <p class="subtitle">Enter the 6-digit pairing code from your admin dashboard</p>

        <div class="code-inputs">
            <input type="text" maxlength="1" class="code-input" data-index="0" inputmode="numeric" pattern="[0-9]">
            <input type="text" maxlength="1" class="code-input" data-index="1" inputmode="numeric" pattern="[0-9]">
            <input type="text" maxlength="1" class="code-input" data-index="2" inputmode="numeric" pattern="[0-9]">
            <input type="text" maxlength="1" class="code-input" data-index="3" inputmode="numeric" pattern="[0-9]">
            <input type="text" maxlength="1" class="code-input" data-index="4" inputmode="numeric" pattern="[0-9]">
            <input type="text" maxlength="1" class="code-input" data-index="5" inputmode="numeric" pattern="[0-9]">
        </div>

        <button class="btn-connect" id="connectBtn" onclick="verifyCode()" disabled>
            🔗 Connect Display
        </button>

        <div id="status" class="status"></div>
    </div>

    <p class="footer">SurePickup Display Pairing</p>

    <script>
        const inputs = document.querySelectorAll('.code-input');
        const connectBtn = document.getElementById('connectBtn');
        const statusEl = document.getElementById('status');

        // Auto-advance on input
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                const value = e.target.value;

                // Only allow numbers
                if (!/^\d*$/.test(value)) {
                    e.target.value = '';
                    return;
                }

                if (value && index < 5) {
                    inputs[index + 1].focus();
                }

                checkComplete();
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !input.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });

            // Handle paste
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pasteData = e.clipboardData.getData('text').replace(/\D/g, '').slice(0, 6);
                pasteData.split('').forEach((char, i) => {
                    if (inputs[i]) inputs[i].value = char;
                });
                if (pasteData.length === 6) {
                    inputs[5].focus();
                }
                checkComplete();
            });
        });

        function checkComplete() {
            const code = getCode();
            connectBtn.disabled = code.length !== 6;
        }

        function getCode() {
            return Array.from(inputs).map(i => i.value).join('');
        }

        function showStatus(message, type) {
            statusEl.className = 'status ' + type;
            statusEl.textContent = message;
        }

        async function verifyCode() {
            const code = getCode();
            if (code.length !== 6) return;

            connectBtn.disabled = true;
            connectBtn.textContent = '⏳ Connecting...';
            showStatus('Verifying pairing code...', 'loading');

            try {
                // Look up the pairing code
                const snapshot = await db.collection('pairingCodes')
                    .where('code', '==', code)
                    .where('used', '==', false)
                    .limit(1)
                    .get();

                if (snapshot.empty) {
                    showStatus('Invalid or expired code. Please try again.', 'error');
                    connectBtn.disabled = false;
                    connectBtn.textContent = '🔗 Connect Display';
                    return;
                }

                const doc = snapshot.docs[0];
                const data = doc.data();

                // Check expiration
                if (data.expiresAt && data.expiresAt < Date.now()) {
                    showStatus('This code has expired. Please generate a new one.', 'error');
                    connectBtn.disabled = false;
                    connectBtn.textContent = '🔗 Connect Display';
                    return;
                }

                showStatus('Code verified! Logging in...', 'success');

                // Mark code as used
                await doc.ref.update({ used: true, usedAt: Date.now() });

                // Sign in with the display credentials
                await auth.signInWithEmailAndPassword(data.email, data.password);

                // PERSIST credentials in localStorage for auto-reconnect
                // IFP browsers often clear IndexedDB (Firebase Auth), but localStorage is more durable
                localStorage.setItem('displayCredentials', JSON.stringify({
                    email: data.email,
                    password: data.password,
                    year: data.year,
                    class: data.class,
                    schoolId: data.schoolId
                }));

                showStatus('Connected! Redirecting to display...', 'success');

                // Redirect to display
                setTimeout(() => {
                    window.location.href = 'display.html';
                }, 1000);

            } catch (error) {
                console.error('Pairing error:', error);
                showStatus('Connection failed: ' + error.message, 'error');
                connectBtn.disabled = false;
                connectBtn.textContent = '🔗 Connect Display';
            }
        }

        // Focus first input on load
        window.onload = () => inputs[0].focus();
    </script>
</body>

</html>
