<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SurePickup - Login Portal">
    <title>Login - SurePickup</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="images/logo.png">
    <style>
        :root {
            --coral: #E07A5F;
            --coral-dark: #C4563A;
            --teal: #3D5A5B;
            --teal-light: #5B8A8B;
            --cream: #F4F1DE;
            --cream-dark: #E8E4CC;
            --charcoal: #2B2D42;
            --sage: #81B29A;
            --sand: #F2CC8F;
            --bg-main: #FDFCF7;
            --text-dark: #2B2D42;
            --text-muted: #6B6E7B;
            --error: #E53935;
            --success: #43A047;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, var(--bg-main) 0%, var(--cream) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 3rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.1),
                0 0 0 1px rgba(255, 255, 255, 0.5) inset;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--teal);
            color: var(--teal);
            text-align: center;
            margin-bottom: 0.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .logo img {
            height: 60px;
            /* Larger logo for login page */
            width: auto;
        }

        .logo span {
            color: var(--coral);
        }

        .tagline {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--charcoal);
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--cream-dark);
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
            background: white;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--teal);
            box-shadow: 0 0 0 4px rgba(61, 90, 91, 0.1);
        }

        .form-group input::placeholder {
            color: var(--text-muted);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--coral);
            color: white;
        }

        .btn-primary:hover {
            background: var(--coral-dark);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(224, 122, 95, 0.3);
        }

        .btn-primary:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .error-message {
            background: rgba(229, 57, 53, 0.1);
            border: 1px solid var(--error);
            color: var(--error);
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .btn.loading .loading-spinner {
            display: inline-block;
        }

        .btn.loading .btn-text {
            opacity: 0.7;
        }

        .forgot-password {
            text-align: center;
            margin-top: 1.5rem;
        }

        .forgot-password a {
            color: var(--teal);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--cream-dark);
        }

        .divider span {
            padding: 0 1rem;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .back-link a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-link a:hover {
            color: var(--teal);
        }

        /* Role indicator after login */
        .user-role {
            text-align: center;
            padding: 0.75rem 1rem;
            background: var(--cream);
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .user-role strong {
            color: var(--teal);
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 2rem;
            }

            .logo {
                font-size: 1.75rem;
            }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="logo">
            <img src="images/logo.png" alt="SurePickup Logo">
            <div>Sure<span>Pickup</span></div>
        </div>
        <p class="tagline">Sign in to continue</p>

        <div class="error-message" id="errorMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn btn-primary" id="loginBtn">
                <span class="loading-spinner"></span>
                <span class="btn-text">Sign In</span>
            </button>
        </form>

        <div class="forgot-password">
            <a href="#" id="forgotPasswordLink">Forgot your password?</a>
        </div>

        <div class="divider">
            <span>or</span>
        </div>

        <div class="back-link">
            <a href="landing.html">← Back to Home</a>
        </div>

    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-functions-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        const form = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const errorMessage = document.getElementById('errorMessage');
        const forgotPasswordLink = document.getElementById('forgotPasswordLink');

        // Check if already logged in
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                // User is signed in, check their role and redirect
                await redirectBasedOnRole(user.uid);
            }
        });

        // Login form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            // Show loading state
            loginBtn.classList.add('loading');
            loginBtn.disabled = true;
            hideError();

            try {
                // Sign in with Firebase Auth
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;

                // Update last login
                await db.collection('users').doc(user.uid).update({
                    lastLogin: firebase.firestore.FieldValue.serverTimestamp()
                }).catch(() => {
                    // User document might not exist yet for new users
                    console.log('User document will be created by admin');
                });

                // Redirect based on role
                await redirectBasedOnRole(user.uid);

            } catch (error) {
                console.error('Login error:', error);
                showError(getErrorMessage(error.code));
            } finally {
                loginBtn.classList.remove('loading');
                loginBtn.disabled = false;
            }
        });

        // Redirect user based on their role
        async function redirectBasedOnRole(userId) {
            try {
                const userDoc = await db.collection('users').doc(userId).get();

                if (!userDoc.exists) {
                    showError('Account not configured. Please contact your administrator.');
                    await auth.signOut();
                    return;
                }

                const userData = userDoc.data();
                const role = userData.role;

                // Store user info in sessionStorage for quick access
                sessionStorage.setItem('userRole', role);
                sessionStorage.setItem('userId', userId);
                sessionStorage.setItem('schoolId', userData.schoolId || '');

                // Redirect based on role
                switch (role) {
                    case 'superAdmin':
                        window.location.href = 'super-admin.html';
                        break;
                    case 'admin':
                        window.location.href = 'admin.html';
                        break;
                    case 'teacher':
                        window.location.href = 'reception.html';
                        break;
                    case 'parent':
                        window.location.href = 'parent.html';
                        break;
                    case 'bus_staff':
                        window.location.href = 'bus.html';
                        break;
                    default:
                        showError('Unknown user role. Please contact support.');
                        await auth.signOut();
                }

            } catch (error) {
                console.error('Role check error:', error);
                showError('Error verifying account. Please try again.');
            }
        }

        // Forgot password handler
        forgotPasswordLink.addEventListener('click', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();

            if (!email) {
                showError('Please enter your email address first.');
                return;
            }

            const originalText = forgotPasswordLink.textContent;
            forgotPasswordLink.textContent = 'Sending reset link...';
            forgotPasswordLink.style.pointerEvents = 'none';
            forgotPasswordLink.style.opacity = '0.7';

            try {
                hideError();
                // Call Custom Cloud Function
                const sendReset = firebase.functions().httpsCallable('sendPasswordReset');
                await sendReset({ email: email });

                alert('check your email for password reset instruction.');
            } catch (error) {
                console.error('Reset error:', error);
                showError('Could not send reset email. Please try again.');
            } finally {
                forgotPasswordLink.textContent = originalText;
                forgotPasswordLink.style.pointerEvents = 'auto';
                forgotPasswordLink.style.opacity = '1';
            }
        });

        // Error message helpers
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }

        function hideError() {
            errorMessage.classList.remove('show');
        }

        function getErrorMessage(errorCode) {
            const messages = {
                'auth/user-not-found': 'No account found with this email.',
                'auth/wrong-password': 'Incorrect password. Please try again.',
                'auth/invalid-email': 'Please enter a valid email address.',
                'auth/too-many-requests': 'Too many failed attempts. Please try again later.',
                'auth/user-disabled': 'This account has been disabled. Contact your administrator.',
                'auth/network-request-failed': 'Network error. Please check your connection.',
                'auth/invalid-credential': 'Invalid credentials. Please check your email and password.'
            };
            return messages[errorCode] || 'An error occurred. Please try again.';
        }
    </script>
</body>

</html>
