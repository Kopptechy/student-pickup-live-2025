<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Request a demo for SurePickup - The #1 Student Pickup System">
    <title>Request Demo - SurePickup</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="images/logo.png">
    <style>
        :root {
            --coral: #E07A5F;
            --coral-dark: #C4563A;
            --teal: #3D5A5B;
            --teal-light: #5B8A8B;
            --cream: #F4F1DE;
            --cream-dark: #E8E4CC;
            --charcoal: #2B2D42;
            --slate: #4A4E69;
            --sage: #81B29A;
            --bg-main: #FDFCF7;
            --text-dark: #2B2D42;
            --text-muted: #6B6E7B;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, var(--bg-main) 0%, var(--cream) 100%);
            min-height: 100vh;
            color: var(--text-dark);
            line-height: 1.6;
        }

        /* Navigation */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(253, 252, 247, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--teal);
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo img {
            height: 40px;
            width: auto;
        }

        .logo span {
            color: var(--coral);
        }

        /* Form Container */
        .page-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 6rem 1rem 2rem;
        }

        .demo-card {
            background: white;
            border-radius: 24px;
            padding: 3rem;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.1), 0 0 0 1px rgba(255, 255, 255, 0.5) inset;
            border: 1px solid rgba(0, 0, 0, 0.05);
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header-content {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header-content h1 {
            font-family: 'Playfair Display', serif;
            color: var(--teal);
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .header-content p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Form Styles */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--charcoal);
            font-weight: 600;
            font-size: 0.95rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid var(--cream-dark);
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
            background: #FAFAFA;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--teal);
            background: white;
            box-shadow: 0 0 0 4px rgba(61, 90, 91, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 1rem;
            background: var(--coral);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .btn-submit:hover {
            background: var(--coral-dark);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(224, 122, 95, 0.3);
        }

        /* Success State */
        .success-message {
            text-align: center;
            display: none;
            padding: 2rem;
        }

        .success-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            display: block;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
        }

        .back-link:hover {
            color: var(--teal);
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full-width {
                grid-column: span 1;
            }

            .demo-card {
                padding: 1.5rem;
            }
        }
    </style>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <a href="index.html" class="logo">
            <img src="images/logo.png" alt="SurePickup Logo">
            Sure<span>Pickup</span>
        </a>
        <a href="index.html" style="text-decoration: none; color: var(--teal); font-weight: 600;">Back to Home</a>
    </nav>

    <div class="page-container">
        <div class="demo-card">
            <!-- Form Section -->
            <div id="formSection">
                <div class="header-content">
                    <h1>Request a Demo</h1>
                    <p>See how SurePickup can transform your school's dismissal process.</p>
                </div>

                <form id="demoForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" id="name" required placeholder="e.g. Jane Director">
                        </div>
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" id="email" required placeholder="name@school.edu">
                        </div>
                        <div class="form-group">
                            <label>School Name</label>
                            <input type="text" id="schoolName" required placeholder="e.g. Oak Valley Academy">
                        </div>
                        <div class="form-group">
                            <label>Role</label>
                            <select id="role" required>
                                <option value="" disabled selected>Select your role...</option>
                                <option value="Principal">Principal / Head of School</option>
                                <option value="Administrator">Administrator</option>
                                <option value="Teacher">Teacher / Staff</option>
                                <option value="Parent">Parent (Inquiry)</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <label>Students Approx.</label>
                        <select id="studentCount">
                            <option value="<100">Less than 100</option>
                            <option value="100-500">100 - 500</option>
                            <option value="500-1000">500 - 1,000</option>
                            <option value="1000+">1,000+</option>
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <label>Message (Optional)</label>
                        <textarea id="message" rows="3" placeholder="Any specific challenges you're facing?"></textarea>
                    </div>

                    <button type="submit" class="btn-submit" id="submitBtn">Submit Request</button>
                </form>
            </div>

            <!-- Success Section -->
            <div id="successSection" class="success-message">
                <span class="success-icon">🎉</span>
                <h2 style="color:var(--teal); margin-bottom:0.5rem;">Request Received!</h2>
                <p style="color:var(--text-muted); margin-bottom:2rem;">
                    Thank you for your interest in SurePickup. Our team will review your request and contact you at
                    <strong id="confirmEmail"></strong> shortly.
                </p>
                <a href="index.html" class="btn-submit"
                    style="display:inline-block; text-decoration:none; width:auto; padding: 0.8rem 2rem;">Return
                    Home</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('demoForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const btn = document.getElementById('submitBtn');
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.textContent = 'Sending...';

            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                school: document.getElementById('schoolName').value,
                role: document.getElementById('role').value,
                studentCount: document.getElementById('studentCount').value,
                message: document.getElementById('message').value,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                status: 'new'
            };

            try {
                // Write to Firestore public collection
                await db.collection('demo_requests').add(formData);

                // Show success
                document.getElementById('formSection').style.display = 'none';
                document.getElementById('successSection').style.display = 'block';
                document.getElementById('confirmEmail').textContent = formData.email;

            } catch (error) {
                console.error("Error submitting form: ", error);
                alert("Something went wrong. Please try again or email info@surepickup.com directly.");
                btn.disabled = false;
                btn.textContent = originalText;
            }
        });
    </script>
</body>

</html>
